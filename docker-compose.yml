# 趋势分析实时买卖点工具 - Docker Compose 一键部署
# 用法：docker compose up -d --build   访问 http://localhost:8795
services:
  qushi:
    build: .
    image: qushi:latest
    container_name: qushi
    ports:
      - "127.0.0.1:8795:8795"
    environment:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      BIND_HOST: "0.0.0.0"
      # 简单登录鉴权（web-auth）：通过 .env 中的 AUTH_PASSWORD 设置
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
      # 2C2G 小机器资源优化：限制并发与缓存，避免和服务器现有服务抢资源
      BREADTH_MAX_WORKERS: "${BREADTH_MAX_WORKERS:-4}"
      DIGEST_SCAN_MAX_WORKERS: "${DIGEST_SCAN_MAX_WORKERS:-4}"
      SCAN_DAILY_MAX_WORKERS: "${SCAN_DAILY_MAX_WORKERS:-20}"
      SCAN_WEEKLY_MAX_WORKERS: "${SCAN_WEEKLY_MAX_WORKERS:-15}"
      KLINE_CACHE_MAX: "${KLINE_CACHE_MAX:-1000}"
    volumes:
      # 持久化运行数据（journal/pool/results/digest）。
      # data/ 是 Python 包（含 kline_fetcher.py），必须绑定挂载整个目录，
      # 不能挂独立数据卷覆盖 /app/data，否则会遮蔽镜像内的代码模块。
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8795/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"