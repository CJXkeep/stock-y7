# 趋势分析实时买卖点工具 - Docker Compose 一键部署
# 用法：docker compose up -d --build   访问 http://localhost:8795
services:
  qushi:
    build: .
    image: qushi:latest
    container_name: qushi
    ports:
      - "8795:8795"
    environment:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
    volumes:
      # 持久化运行数据（journal/pool/results/digest）。
      # data/ 是 Python 包（含 kline_fetcher.py），必须绑定挂载整个目录，
      # 不能挂独立数据卷覆盖 /app/data，否则会遮蔽镜像内的代码模块。
      - ./data:/app/data
    restart: unless-stopped