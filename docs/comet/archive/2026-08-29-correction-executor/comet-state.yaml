    text: "**A3 参数硬门槛**（从 results.csv 按 score 现算）：两档任一 <50 → 拒绝；方向不一致（强≤买 在 r20/r60
      或任一年份拆分）→ 拒绝；±5 邻域任一组单调性翻转 → 拒绝；confirmed≠true 或 operator 空 → 拒绝；全通过 +
      confirmed=true → 写 params_override.json + 备份 + 日志，且 --dry-run 同样校验但不写盘。"
    result: passed
    reason:
      text: 门槛全部由 _retier 按 results.csv score 重分档现算，独立复算 n≥50、r20/r60×两年方向、±5
