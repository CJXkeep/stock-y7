acceptance:
  - id: A1
    source: brief.md
    text: A1 配置持久化：保存后 `data/notify.json` 原子写入且版本递增；文件损坏时回退默认配置并告警，服务不崩。
    result: passed
    reason:
      text: save_notify_config 原子写盘 tmp+os.replace 且 version
        递增，损坏时告警回退默认；ConfigStoreTest 3 例覆盖
      truncated: false
  - id: A2
    source: brief.md
    text: A2 webhook 校验：仅接受 `https://oapi.dingtalk.com/robot/send?access_token=...`
      形式；其他 host 保存被拒并返回人话错误。
    result: passed
    reason:
      text: is_dingtalk_webhook 强制 https+oapi.dingtalk.com+/robot/send 结尾，save 对非法
        host 返回人话错误
      truncated: false
  - id: A3
    source: brief.md
    text: A3 脱敏：`GET /api/notify` 与保存响应中的 webhook 只露 token 首尾各 4 位，完整 token
      不出现在任何接口响应。
    result: passed
    reason:
      text: GET/save 响应只含 webhook_masked；mask_webhook 原串替换仅露 token 首尾4位且星号不被转义；无完整
        token 出口
      truncated: false
  - id: A4
    source: brief.md
    text: A4 加签：配置 SEC 密钥时请求 URL 附 `timestamp`+`sign`（HMAC-SHA256，base64 后 URL
      编码）；未配置密钥时原样 URL 发送。
    result: passed
    reason:
      text: signed_url 按 string_to_sign={ts}\n{secret} 做
        HMAC-SHA256→base64→quote_plus；无 secret 原样返回；测试独立重算签名交叉验证
      truncated: false
  - id: A5
    source: brief.md
    text: A5 发送测试：「发送测试」向钉钉群发出连通性测试消息，成功/失败均 toast 人话结果（errcode/网络异常归类）。
    result: passed
    reason:
      text: test action 发送连通性消息并归类 errcode/异常；前端 toast 人话结果
      truncated: false
  - id: A6
    source: brief.md
    text: A6 自动巡检：启用且配置有效时，watcher 在交易时段（周一~五 09:15–11:35、12:55–15:05
      本地时间）按设定间隔分析全部自选；非时段进入 waiting_market；服务重启后无需重新配置即恢复巡检。
    result: passed
    reason:
      text: _in_watch_session 与 app 同口径时段；watcher 15s 轮询按 interval 节流首轮立即触发；main() 启动即
        start_watcher 且配置持久化重启免重配
      truncated: false
  - id: A7
    source: brief.md
    text: A7 推送内容：检出买入类信号推送一条合并 markdown，逐条含
      名称(代码)/动作/现价与涨跌幅/评分/入场·止损·目标计划/触发日，尾部带口径提醒；无信号时不发消息。
    result: passed
    reason:
      text: build_signal_message 合并 markdown 含名称(代码)/动作/现价涨跌%/评分/计划/触发日+口径提醒；pushable
        空不发送
      truncated: false
  - id: A8
    source: brief.md
    text: A8 落档一致：watcher 检出的信号照常写入 `data/journal/`（含卖出类），信号档案页可见并可补记收益。
    result: passed
    reason:
      text: 卖出类照常落档仅推送层过滤买侧；e2e 断言档案恰 1 条
      truncated: false
  - id: A9
    source: brief.md
    text: A9 不重复打扰：同股同类同 trigger_date 的精确键只推一次；10 交易日窗口内的重复落档标记 deduped
      且不推送；盘中反复巡检不会刷屏。
    result: passed
    reason:
      text: select_pushable 与 append_records 完全同语义（精确键+mark_window 尾段标记）；e2e 第二轮
        pushed=0 档案仍 1 条
      truncated: false
  - id: A10
    source: brief.md
    text: A10 失败安全：钉钉不可达/errcode≠0 时把错误记入状态行，HTTP
      主流程不受影响；该批次已落档，下轮不会被再次判定为待推送（无补发风暴）。
    result: passed
    reason:
      text: cfg.get 兜底修复 KeyError；发送失败仅写 last_error 且落档先于发送，下轮 found=0 无补发风暴（专项测试）
      truncated: false
  - id: A11
    source: brief.md
    text: A11 立即巡检：`POST /api/notify {action:"run_once", force:true}`
      后台执行一轮并跳过交易时段检查，供随时端到端验证。
    result: passed
    reason:
      text: run_once force 后台 daemon 执行即时 accepted；前端发 force:true 并双刷新状态
      truncated: false
  - id: A12
    source: brief.md
    text: A12 并发防护：同一时刻仅允许一轮巡检；watcher 轮询与手动触发的并发请求直接返回 busy，不产生双重推送。
    result: passed
    reason:
      text: _cycle_lock 非阻塞互斥占用即 busy，watcher 与手动触发共用
      truncated: false
  - id: A13
    source: brief.md
    text: A13 前端入口：设置弹窗「钉钉推送」区可完成 启用/间隔/webhook/SEC
      配置、保存、发送测试、立即巡检与状态查看；打开设置面板时自动刷新状态；输入框留空保存=保持不变。
    result: passed
    reason:
      text: 设置区控件齐全；toggleSettings 打开刷新状态；留空保存经 placeholder 回显+服务端 _keep_or 保持不变
      truncated: false
  - id: A14
    source: brief.md
    text: A14 回归：`python tests/test_notify_service.py` 与 `python run_all_tests.py`
      全量通过（新文件已纳入守护测试期望）。
    result: passed
    reason:
      text: Runtime 实测 py_compile、test_notify_service 全绿、SCOPE OK、server/module split
        7/7、MODULE LINK OK、run_all_tests 23/23 文件通过
      truncated: false
