      评估建议；无超额列 → 无法判定。T4 最近 91 自然日 r20 均值 <0 且 n≥10 → 触发 R2 报告层建议。T5 强烈买入/买入任一档
      n<10 且上评同档也 <10 → 参数观察标记；仅本评 <10 → 观察。T6 任一参与档 n<10 → R4 持续状态提示。"
    result: passed
    reason:
      text: 独立重算 T1（len−last_count≥50 精确边界 new=50
        触发、需本评+上评双全单调、首评不触发）、T3（按(date,symbol)排序末100笔均值与手工计算逐位一致、by_symbol
