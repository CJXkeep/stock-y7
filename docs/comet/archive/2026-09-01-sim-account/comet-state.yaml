  - id: A1
    source: brief.md
    text: "**A1** 选股：`universe=scan` 时全 A 快照剔除 ST / 退市 / 停牌后按成交额取前 N；
      命中买入档位的候选补拉资金流重算，其最终动作与 `/api/analyze` 同标的同口径一致。"
    result: passed
    reason:
      text: ScanUniverse 剔ST/退/停牌按成交额取前N；QushiV5Adapter 两阶段资金流与 /api/analyze 同口径
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2** 决策：候选按综合分降序；已持有、同 `trigger_date` 已买、当日卖出过、 评分低于
      `min_score`、持仓数达上限、现金不足一手的候选均不买入。"
    result: passed
    reason:
      text: 六种不买情形（已持有/同trigger_date已买/当日卖出过/评分不足/持仓满/现金不足）全实现
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3** 仓位：强烈买入 / 买入 / 谨慎买入三档的实际买入金额 ≈ 总资产 × `per_trade_pct` × 档位系数（1.0 /
      0.7 / 0.4），且货款 + 费用不超过可用资金。"
    result: passed
    reason:
      text: budget=总资产×per_trade_pct×level_scale(1.0/0.7/0.4)，货款+费用≤可用资金
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4** 撮合：成交价 = 行情价 ± 0.1% 滑点（买上浮 / 卖下压，0.01 元步进）； 费用 = 佣金 `max(0.025% ×
      金额, 5 元)` 双边 + 印花税卖出 0.05%；按 100 股整手下单。"
    result: passed
    reason:
      text: 滑点±0.1%买上浮卖下压0.01步进；佣金max(0.025%,5元)双边+印花税卖出0.05%；整手100股
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5** T+1 与单仓位：当日买入的持仓当日不可卖出；单标的单仓位，已持有不再买入。"
    result: passed
    reason:
      text: buy_date==today返回t1_restriction；已持有返回already_holding（单仓位）
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6** 卖出：超期 / 止损 / 止盈 / 信号 / 手动五类原因均可触发卖出， 判定顺序为 超期 → 止损 → 止盈 → 信号。"
    result: passed
    reason:
      text: 判定顺序 超期→止损→止盈→信号，支持手动
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7** 记账：`cost_basis` 含买入费用；卖出盈亏 = 卖出净收入 − 结转成本（净盈亏已扣
      全部费用）；`trades.jsonl` 逐笔可手工核对，资金守恒 （现金 + 持仓市值 = 初始资金 + 累计净盈亏）。"
    result: passed
    reason:
      text: cost_basis含买入费用；盈亏=净收入−结转成本；资金守恒测试通过
      truncated: false
  - id: A8
    source: brief.md
    text: "**A8** 绩效：净值序列上可算出年化 / 最大回撤 / 夏普 / 卡玛，数值可手算复核， 样本不足时明确标注而非硬算。"
    result: passed
    reason:
      text: 年化/最大回撤/夏普(rf=0%)/卡玛手算复核；样本不足标注
      truncated: false
  - id: A9
    source: brief.md
    text: "**A9** 调度：默认关闭；开启后仅在交易时段按 `interval_min` 巡检；选股受 `screening_interval_min`
      节流；持仓数达上限时跳过选股。"
    result: passed
    reason:
      text: 默认关闭；交易时段按interval_min巡检；screening_interval_min节流；持仓满跳选股
