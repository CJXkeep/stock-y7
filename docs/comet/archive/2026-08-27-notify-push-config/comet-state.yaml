acceptance:
  - id: A1
    source: brief.md
    text: A1 默认兼容：无 `push` 字段（或空值）时 load 返回默认值——levels = 买侧全开、scope = 全自选、thresholds
      关闭；已有 `data/notify.json` 与既有行为不变。
    result: passed
    reason:
      text: load_notify_config returns default_push_config() when file missing/push
        absent (levels=BUY_SIDE_TYPES all-on, scope=all-watchlist, thresholds
        off); existing v1 behavior unchanged
        (PushConfigTest.test_default_push_keeps_v1_behavior /
        test_missing_push_returns_defaults).
      truncated: false
  - id: A2
    source: brief.md
    text: A2 持久化：save 原子写盘且 version+1；新字段按规则归一化（levels 白名单去重、scope
      列表字符串化去重、min_score 夹取 [0,100]、min_pct_change 非负 float / null），非法输入不写坏配置。
    result: passed
    reason:
      text: save_notify_config writes atomically via tmp+os.replace and bumps
        version+1; _norm_levels whitelist+dedup,
        _norm_id_list/_norm_symbol_codes stringify+dedup, _norm_min_score clamps
        [0,100], _norm_min_pct non-negative float/None; invalid input
        normalized, never corrupts config.
      truncated: false
  - id: A3
    source: brief.md
    text: A3 级别过滤：`levels=["strong_buy"]` 时仅 strong_buy 可推送；buy / cautious_buy
      仍落档（fresh）但不推送。
    result: passed
    reason:
      text: _is_pushable rejects signal_type not in push.levels, so buy/cautious_buy
        stay fresh but not pushed under levels=['strong_buy']
        (test_levels_filter_keeps_fresh).
      truncated: false
  - id: A4
    source: brief.md
    text: A4 空级别：`levels=[]` 时任何买侧信号都落档但不推送。
    result: passed
    reason:
      text: levels=[] makes the membership check always false; any buy-side signal
        archived fresh but never pushed (test_empty_levels_pushes_nothing).
      truncated: false
  - id: A5
    source: brief.md
    text: A5 卖出不变式：无论 levels 如何，`breakout_exit` / `short_cover` 均不推送（照常落档）。
    result: passed
    reason:
      text: select_pushable skips non-BUY_SIDE_TYPES before filtering, so
        breakout_exit/short_cover are archived but never pushed regardless of
        levels (test_sell_side_archived_but_not_pushed).
      truncated: false
  - id: A6
    source: brief.md
    text: A6 分组过滤：`enabled_groups=[g1]` 时，仅 g1 内代码的信号推送；其他组代码落档但不推。
    result: passed
    reason:
      text: _is_pushable requires group overlap when enabled_groups non-empty;
        other-group symbols stay fresh but not pushed (test_group_filter).
      truncated: false
  - id: A7
    source: brief.md
    text: A7 单只开关：即使某代码所在组被启用，只要其在 `disabled_symbols` 中就不推送（优先级最高）。
    result: passed
    reason:
      text: disabled_symbols is checked first in _is_pushable and vetoes even when the
        group is enabled (test_disabled_symbol_veto_wins_over_group).
      truncated: false
  - id: A8
    source: brief.md
    text: A8 默认范围：`enabled_groups` 与 `disabled_symbols` 均为空时推送全部自选（与现状一致）。
    result: passed
    reason:
      text: empty enabled_groups and disabled_symbols impose no scope restriction; all
        watchlist buy-side pushed (test_default_scope_pushes_all).
      truncated: false
  - id: A9
    source: brief.md
    text: A9 阈值评分：`min_score=80` 时 score<80 不推送、score>=80 推送；无 score 字段的记录不被评分过滤拦截。
    result: passed
    reason:
      text: min_score filters only when score is numeric and below it; records with no
        score (None) are not blocked (test_min_score_threshold).
      truncated: false
  - id: A10
    source: brief.md
    text: A10 阈值涨跌幅：`min_pct_change=X` 时仅当前涨跌幅 >= X% 的记录推送；pct 不可用时不拦截。
    result: passed
    reason:
      text: min_pct_change filters only when pct is numeric and below it; records with
        unavailable pct are not blocked via pct_map keyed by exact_key
        (test_min_pct_threshold).
      truncated: false
  - id: A11
    source: brief.md
    text: A11 阈值关闭：thresholds 默认值不产生任何过滤。
    result: passed
    reason:
      text: default thresholds min_score=0 (falsy -> no filter) and
        min_pct_change=None (no filter) produce no filtering
        (test_thresholds_disabled_by_default).
      truncated: false
  - id: A12
    source: brief.md
    text: A12 落档与去重不变：任一维度过滤命中的记录仅不推送，仍 fresh 落档并参与去重窗口；run_watch_cycle 返回
      appended>=1、pushed=0，且下轮不重复推、无补发风暴。
    result: passed
    reason:
      text: select_pushable returns fresh regardless of filters; filtered records
        still archived and deduped via exact_key/mark_window; run_watch_cycle
        returns appended>=1/pushed=0 and suppresses repush next round
        (test_filtered_still_fresh_then_dedup_suppresses, end_to_end,
        send_failure_no_retry_storm).
      truncated: false
  - id: A13
    source: brief.md
    text: A13 API 契约：GET /api/notify 返回 push 结构（levels / scope /
      thresholds）及可选分组与股票清单，webhook 仍脱敏；POST save 可保存并回显归一化后的 push
      配置，非法配置被拒绝或归一化（不崩溃）。
    result: passed
    reason:
      text: GET /api/notify returns
        push{levels,scope,thresholds}+watchlist_groups/stocks and masks webhook;
        POST save persists and echoes normalized push, rejects foreign webhook
        without crashing (ApiHandlerTest).
      truncated: false
  - id: A14
    source: brief.md
    text: A14 前端：设置弹窗「钉钉推送」区展示信号级别勾选、分组勾选、单只开关与两个阈值输入；打开时回显已存配置，保存经 POST 提交并 toast
      结果。
    result: passed
    reason:
      text: index.html has level checkboxes, group list, per-stock scroll list and two
        threshold inputs; notify.js _fillForm renders/checks from GET and
        _readForm builds push payload for POST save with toast; required CSS
        classes present; module-existence and node module-link checks pass.
      truncated: false
  - id: A15
    source: brief.md
    text: A15 回归：`python tests/test_notify_service.py`
      通过，且守护测试期望同步（`tests/test_server_split.py` / `tests/test_module_split.py` /
      `tools/check_backend_scope.py` 涉及文件清单校验的纳入新文件名）。
    result: passed
    reason:
      text: python tests/test_notify_service.py 47/47 OK (new
        PushConfigTest/SelectPushFilterTest/API push-contract),
        test_server_split.py 7/7, test_module_split.py 7/7,
        check_backend_scope.py SCOPE OK, py_compile OK, node check_modules
        MODULE LINK OK, run_all_tests.py 25/25 files 0 failures; guard files
        reference notify_service.py/notify.js.
      truncated: false
