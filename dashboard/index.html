<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趋势分析实时买卖点</title>
<script src="vendor/echarts.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="sb-section-watch">

<div class="topbar">
  <div class="logo">趋势分析</div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="代码/名称 如 600519" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="hot-stocks">
    <button class="hs-btn" onclick="analyze('600519')">茅台</button>
    <button class="hs-btn" onclick="analyze('601899')">紫金矿业</button>
    <button class="hs-btn" onclick="analyze('600276')">恒瑞医药</button>
    <button class="hs-btn" onclick="analyze('588170')">科创半导体</button>
    <button class="hs-btn" onclick="analyze('000001')">平安银行</button>
  </div>
  <button class="scan-btn" id="scan-btn" onclick="openScan()">扫描买入</button>
  <div class="mode-toggle">
    <button class="mt-btn active" id="mt-pro" onclick="setMode('pro')">专业</button>
    <button class="mt-btn" id="mt-simple" onclick="setMode('simple')">小白</button>
    <button class="mt-btn" id="mt-settings" title="设置" onclick="toggleSettings()">⚙</button>
    <button class="mt-btn" id="btn-logout" title="退出登录" style="display:none" onclick="doLogout()">退出</button>
  </div>
  <div class="watch-wrap">
    <button class="wc-btn wc-star" id="star-btn" title="加入/移除自选" onclick="toggleStar()">☆</button>
    <button class="wc-btn" id="watch-btn" style="position:relative" onclick="toggleSbSection('watch')">自选<span class="wc-badge" id="watch-count" style="display:none">0</span><span class="wc-change-badge" id="watch-change" style="display:none">0</span></button>
    <button class="wc-btn" id="history-btn" onclick="toggleSbSection('history')">历史<span class="wc-badge" id="history-count" style="display:none">0</span></button>
  </div>
  <div class="quote-bar" id="quote-bar">
    <span class="qb-name flat">输入代码开始分析</span>
  </div>
</div>

<!-- ===== 左侧工作台（frontend迭代：自选/历史/一览/档案/核心池/扫描归档 分区） ===== -->
<div id="sidebar" class="sidebar">
  <div class="sb-header">
    <span class="sb-title" id="sb-title">自选股</span>
    <button class="sb-collapse-btn" id="sb-toggle" title="收起/展开侧边栏" onclick="toggleSidebar()">◀</button>
  </div>
  <div class="sb-tabs" id="sb-tabs">
    <button class="sb-tab active" data-sb="watch">自选</button>
    <button class="sb-tab" data-sb="history">历史</button>
    <button class="sb-tab" data-sb="overview">一览</button>
    <button class="sb-tab" data-sb="journal">档案</button>
    <button class="sb-tab" data-sb="pool">核心池</button>
    <button class="sb-tab" data-sb="digest">速递</button>
    <button class="sb-tab" data-sb="scan">扫描档</button>
  </div>

  <!-- 分区：自选股（窄栏） -->
  <div id="sb-pane-watch" class="sb-pane active">
    <div class="sb-groups" id="sb-groups"></div>
    <div class="sb-footer">
      <button class="sb-add-group" onclick="addGroupInline()">+ 新建分组</button>
    </div>
  </div>

  <!-- 分区：历史 / 一览 / 档案 / 核心池（宽面板，原 wp-panel 迁入） -->
  <div id="sb-pane-modules" class="sb-pane">
    <div class="wp-panel sb-wp-host show" id="wp-panel">
      <div class="wp-tabs">
        <button class="wp-tab" data-tab="history" onclick="openSbSection('history')">历史记录<span class="wp-tab-count" id="ht-count"></span></button>
        <button class="wp-tab" data-tab="overview" onclick="openSbSection('overview')">多股一览<span class="wp-tab-count" id="ov-count"></span></button>
        <button class="wp-tab" data-tab="journal" onclick="openSbSection('journal')">信号档案</button>
        <button class="wp-tab" data-tab="pool" onclick="openSbSection('pool')">核心池</button>
        <button class="wp-tab" data-tab="digest" onclick="openSbSection('digest')">每日速递</button>
      </div>
      <div class="wp-list" id="wp-content-history"></div>
      <div class="wp-list" id="wp-content-overview" style="display:none"></div>
      <div class="wp-list" id="wp-content-journal" style="display:none"></div>
      <div class="wp-list" id="wp-content-pool" style="display:none"></div>
      <div class="wp-list" id="wp-content-digest" style="display:none"></div>
      <div class="wp-footer" id="wp-footer" style="display:none">
        <span class="wp-footer-info" id="wp-footer-info"></span>
        <button class="wp-clear" id="wp-clear-btn" onclick="clearCurrentTab()">清空</button>
      </div>
    </div>
  </div>

  <!-- 分区：扫描归档（宽面板） -->
  <div id="sb-pane-scan" class="sb-pane">
    <div id="sb-wide-scan"></div>
  </div>

  <span class="sb-collapsed-badge"></span>
</div>

<div class="main">
  <!-- ===== 左侧：图表 ===== -->
  <div class="left-panel">
    <div class="chart-toolbar">
      <button class="tb-btn active" id="view-dayk">日K</button>
      <button class="tb-btn" id="view-week">周K</button>
      <button class="tb-btn" id="view-minute">分时</button>
      <div class="tb-sep" id="sep-range"></div>
      <button class="tb-btn" data-range="20">1月</button>
      <button class="tb-btn active" data-range="60">3月</button>
      <button class="tb-btn" data-range="120">半年</button>
      <button class="tb-btn" data-range="250">1年</button>
      <button class="tb-btn" data-range="500">2年</button>
      <button class="tb-btn" data-range="750">3年</button>
      <button class="tb-btn" data-range="0">全部</button>
      <div class="tb-sep"></div>
      <span class="tb-label" id="zoom-info"></span>
    </div>

    <div class="chart-container">
      <div id="kline-chart"></div>
      <div id="volume-chart"></div>
      <div class="indicator-toolbar" id="indicator-toolbar" style="display:none">
        <button class="it-btn active" data-ind="none" onclick="switchIndicator('none')">副图</button>
        <button class="it-btn" data-ind="macd" onclick="switchIndicator('macd')">MACD</button>
        <button class="it-btn" data-ind="rsi" onclick="switchIndicator('rsi')">RSI</button>
        <button class="it-btn" data-ind="kdj" onclick="switchIndicator('kdj')">KDJ</button>
        <button class="it-btn" data-ind="boll" onclick="switchIndicator('boll')">BOLL</button>
        <button class="it-btn" data-ind="wr" onclick="switchIndicator('wr')">WR</button>
      </div>
      <div id="indicator-chart"></div>
      <div id="minute-chart"></div>
      <div id="minute-vol"></div>
      <div class="flow-section">
        <div class="fs-title">
          <span style="color:#ff9800">资金流向</span>
          <span id="flow-summary"></span>
          <span class="flow-toggle">
            <button class="ft-btn ft-active" id="ft-rt" onclick="switchFlowMode('realtime')">今日实时</button>
            <button class="ft-btn" id="ft-daily" onclick="switchFlowMode('daily')">近30日</button>
          </span>
        </div>
        <div id="flow-chart"></div>
      </div>
      <div class="loading-overlay" id="loading">
        <div class="spinner-wrap" id="spinner-fallback">
          <div class="spinner"></div>
          <div class="sk-fallback-text">分析中，请稍候…</div>
        </div>
        <div class="skeleton-wrap" id="skeleton-wrap">
          <div class="sk sk-line w60"></div><div class="sk sk-line w90"></div><div class="sk sk-line w75"></div>
          <div class="sk-row"><div class="sk sk-block"></div><div class="sk sk-block"></div><div class="sk sk-block"></div></div>
          <div class="sk sk-line w80"></div><div class="sk sk-line w50"></div>
          <div class="sk-fallback-text">分析中，请稍候…</div>
        </div>
      </div>
      <div id="signal-tooltip"></div>
    </div>
  </div>

  <!-- ===== 右侧：信号 ===== -->
  <div class="right-panel">
    <!-- 一句话总结（小白第一眼看的） -->
    <div class="summary-card" id="summary-card">
      <div class="sc-header">AI 分析结论</div>
      <div class="sum-body" id="sum-body">
        <div class="sum-action-row">
          <span class="sum-badge sum-badge-watch">等待分析</span>
          <span class="sum-strength">--</span>
          <span class="sum-score-big flat">--</span>
        </div>
        <div class="sum-text" style="color:#666">输入股票代码或点击上方热门股票开始分析</div>
      </div>
      <div id="sum-meta" style="padding:6px 14px;font-size:10px;color:#888;border-top:1px solid #222"></div>
    </div>

    <!-- 操作计划（具体怎么操作） -->
    <div class="plan-card" id="plan-card" style="display:none">
      <div class="sc-header" style="color:#ff9800">操作计划</div>
      <div class="plan-body" id="plan-body"></div>
    </div>

    <!-- 大盘环境 -->
    <div class="signal-card" id="market-card" style="display:none">
      <div class="sc-header" style="color:#4fc3f7">大盘环境</div>
      <div id="market-body" style="padding:8px 12px;font-size:12px;line-height:1.6"></div>
    </div>

    <!-- 模块评分 -->
    <div class="signal-card" data-card="module">
      <div class="sc-header" onclick="toggleCard(this)"><span class="sc-arrow">▼</span>模块评分</div>
      <div class="module-list" id="module-list"></div>
    </div>

    <!-- 买卖信号 -->
    <div class="signal-card" data-card="signals">
      <div class="sc-header" onclick="toggleCard(this)"><span class="sc-arrow">▼</span>买卖信号</div>
      <div class="sig-list" id="sig-list"></div>
    </div>

    <!-- 动量/资金/市场环境综合分 -->
    <div class="signal-card" data-card="momentum">
      <div class="sc-header" onclick="toggleCard(this)"><span class="sc-arrow">▼</span>动量/资金/市场环境</div>
      <div class="cs-grid" id="cs-grid"></div>
      <div id="cs-simple"></div>
    </div>

    <!-- 关键价位 -->
    <div class="signal-card" data-card="levels">
      <div class="sc-header" onclick="toggleCard(this)"><span class="sc-arrow">▼</span>关键价位</div>
      <div class="kl-grid" id="kl-grid"></div>
    </div>

    <!-- 缠论日线/周线分析 -->
    <div class="chanlun-card" id="chanlun-daily-card" data-card="chanlun-daily" style="display:none">
      <div class="sc-header" style="color:#7F77DD" id="chanlun-daily-title"><span class="sc-arrow">▼</span><span id="chanlun-daily-label">缠论日线分析</span></div>
      <div class="cl-body" id="chanlun-daily-body"></div>
    </div>

    <!-- 缠论分时分析 -->
    <div class="chanlun-card" id="chanlun-card" data-card="chanlun-minute">
      <div class="sc-header" style="color:#ff9800"><span class="sc-arrow">▼</span>缠论分时分析</div>
      <div class="cl-body" id="chanlun-body"></div>
    </div>

    <!-- 相邻查看方向一致率 -->
    <div class="signal-card signal-accuracy-card" id="accuracy-card" data-card="accuracy">
      <div class="sc-header" onclick="toggleCard(this)"><span class="sc-arrow">▼</span>相邻查看方向一致率</div>
      <div class="sa-stats" id="sa-stats"></div>
      <div class="sa-detail" id="sa-detail"></div>
    </div>

    <!-- 风险提示 -->
    <div class="signal-card" id="risk-card" data-card="risk" style="display:none">
      <div class="sc-header" style="color:#ffc107"><span class="sc-arrow">▼</span>风险提示</div>
      <div class="sig-list" id="risk-list"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<!-- ===== 设置弹层（动效档位 + 自选导入导出） ===== -->
<div class="settings-overlay" id="settings-overlay" onclick="closeSettings(event)">
  <div class="settings-modal" onclick="event.stopPropagation()">
    <div class="settings-header"><span>设置</span><button class="settings-close" onclick="closeSettings()">&times;</button></div>
    <div class="settings-section">
      <div class="settings-label">界面动效</div>
      <div class="fx-options" id="fx-options">
        <button class="fx-opt" data-fx="off" onclick="setFx('off')">关</button>
        <button class="fx-opt" data-fx="std" onclick="setFx('std')">标准</button>
        <button class="fx-opt" data-fx="max" onclick="setFx('max')">炫酷</button>
        <button class="fx-opt" data-fx="auto" onclick="setFx('auto')">自动</button>
      </div>
      <div class="settings-hint" id="fx-hint"></div>
    </div>
    <div class="settings-section">
      <div class="settings-label">自选股备份</div>
      <div class="settings-row">
        <button class="settings-btn" onclick="exportWatchlist()">导出 JSON</button>
        <button class="settings-btn" onclick="document.getElementById('import-file').click()">导入 JSON</button>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importWatchlist(this)">
      </div>
      <div class="settings-hint">自选股保存在本机浏览器，换设备请先导出备份。</div>
    </div>
  </div>
</div>

<!-- 术语解释气泡 / 右键菜单（复用容器，JS 控制显隐） -->
<div id="glossary-pop" class="glossary-pop" style="display:none"></div>
<div id="ctx-menu" class="ctx-menu" style="display:none"></div>

<script src="glossary.js"></script>
<script src="app.js"></script>

<!-- ===== 扫描弹窗 ===== -->
<div class="scan-overlay" id="scan-overlay" onclick="closeScan(event)">
  <div class="scan-modal" onclick="event.stopPropagation()">
    <div class="scan-header">
      <span class="scan-title">全A股双周期扫描</span>
      <button class="scan-close" onclick="closeScan()">&times;</button>
    </div>
    <div class="scan-body" id="scan-body">
      <div id="scan-content"></div>
    </div>
  </div>
</div>


</body>
</html>
